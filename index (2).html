<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#0d1920">

  <meta name="color-scheme" content="dark">

  <title>Input Event Gangguan – UP3 Garut</title>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <style>
    /* =================================
       01. DESIGN TOKENS
       Warna mengikuti form FGTM (latar senja gelap, aksen kuning).
    ================================= */

    :root {
      --bg: #0d1920;
      --loader-bg: #10222b;
      --loader-text: #f1f5f4;
      --loader-muted: #9fb0b3;
      --accent: #f2c230;
    }

    /* =================================
       02. RESET & DOCUMENT
    ================================= */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      overflow: hidden;

      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;

      background: var(--bg);
    }

    body {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      overflow: hidden;
      background: var(--bg);

      overscroll-behavior: none;
    }

    /* =================================
       03. APP CONTAINER
    ================================= */

    .app {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;
      isolation: isolate;
    }

    /* =================================
       04. LOADING SCREEN
    ================================= */

    .loader {
      position: absolute;
      inset: 0;
      z-index: 1;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 16px;

      padding: 24px;

      background: var(--loader-bg);
      color: var(--loader-text);

      font-family: system-ui, sans-serif;
      text-align: center;

      transition: opacity .3s ease,
                  visibility .3s ease;
    }

    .loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-ring {
      width: 38px;
      height: 38px;

      border: 3px solid rgba(255,255,255,.12);
      border-top-color: var(--accent);

      border-radius: 50%;

      animation: spin .8s linear infinite;
    }

    .loader-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .2px;
    }

    .loader-subtitle {
      font-size: 12px;
      color: var(--loader-muted);
      max-width: 320px;
      line-height: 1.5;
    }

    .loader-open {
      display: none;

      padding: 10px 18px;
      border-radius: 10px;

      background: var(--accent);
      color: #1b1a12;

      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }

    .loader.slow .loader-open {
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* =================================
       05. FORM IFRAME
    ================================= */

    .form-frame {
      position: absolute;
      inset: 0;

      display: block;

      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      border: 0;
      outline: 0;

      background: transparent;

      pointer-events: auto;
    }

    /* =================================
       06. ACCESSIBILITY
    ================================= */

    @media (prefers-reduced-motion: reduce) {
      .loader-ring {
        animation-duration: 2s;
      }

      .loader {
        transition: none;
      }
    }

    /* =================================
       07. VIEWPORT FALLBACK
    ================================= */

    @supports (height: 100dvh) {
      .app {
        height: 100dvh;
      }
    }

  </style>
</head>

<body>

  <main class="app">

    <div class="loader" id="loader" role="status">
      <div class="loader-ring"></div>

      <div class="loader-title">
        Input Event Gangguan UP3 Garut
      </div>

      <div class="loader-subtitle">
        Membuka form...
      </div>

      <a
        class="loader-open"
        id="openDirect"
        href="https://script.google.com/macros/s/AKfycbxtR00cw3PJyanQgoNcpQo2hbU10e2KDVu-yeY9rLsUwq5Ti0p3MHQ0cquaacccBvSutw/exec"
        target="_blank"
        rel="noopener">
        Buka form langsung
      </a>
    </div>

    <iframe
      id="form"
      class="form-frame"

      src="https://script.google.com/macros/s/AKfycbxtR00cw3PJyanQgoNcpQo2hbU10e2KDVu-yeY9rLsUwq5Ti0p3MHQ0cquaacccBvSutw/exec"

      title="Input Event Gangguan UP3 Garut"

      allow="geolocation; camera; clipboard-write; fullscreen"
      allowfullscreen

      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

  </main>

  <script>
    (() => {
      "use strict";

      const frame = document.getElementById("form");
      const loader = document.getElementById("loader");

      let loaded = false;

      frame.addEventListener("load", () => {
        loaded = true;

        loader.classList.add("hidden");
      });

      // Fallback jika proses pemuatan terlalu lama.
      // Tidak menganggap timeout sebagai bukti iframe gagal,
      // tapi memberi jalan pintas membuka form di tab sendiri.
      window.setTimeout(() => {
        if (!loaded) {
          loader.classList.add("slow");
          loader.querySelector(".loader-subtitle").textContent =
            "Form masih dimuat. Kalau tidak muncul juga, buka langsung lewat tombol di bawah.";
        }
      }, 15000);

    })();
  </script>

</body>
</html>
